<script>
let c, x, mc, mx;
const mch = "木火土金水天地人日月星辰风云雷雨电晴阴寒暑时形兵".split("");
let drops = [], mDrops = [];

// ФИКС ИЕРАРХИИ: Объявляем музыкальный движок в самом верху, чтобы клик-триггер его сразу видел!
let musicInterval = null, melodyStep = 0;
const guqinScale = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25, 587.33];

window.snd = function(f, d, type="sine") {
    try {
        const ctx = new(window.AudioContext || window.webkitAudioContext)();
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.connect(g); g.connect(ctx.destination); o.type = type;
        o.frequency.setValueAtTime(f, ctx.currentTime);
        if (type === "sawtooth" || type === "triangle") {
            g.gain.setValueAtTime(0.05, ctx.currentTime);
            g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + d);
        } else {
            g.gain.setValueAtTime(0.1, ctx.currentTime);
            g.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + d);
        }
        o.start(); o.stop(ctx.currentTime + d);
    } catch (e) {}
};

function startChineseBGM() {
    if (musicInterval) return;
    musicInterval = setInterval(() => {
        if (gOver || animating) return;
        if (melodyStep % 2 === 0 && Math.random() > 0.3) {
            const freq = guqinScale[Math.floor(Math.random() * guqinScale.length)];
            snd(freq, 0.7, "triangle");
            if (Math.random() > 0.6) {
                setTimeout(() => snd(freq * 1.5, 0.4, "sine"), 220);
            }
        }
        melodyStep++;
    }, 450);
}

function startMatrixEngines() {
    c = document.getElementById('m'); x = c.getContext('2d');
    mc = document.getElementById('menu-canvas'); mx = mc.getContext('2d');
    c.width = window.innerWidth; c.height = window.innerHeight;
    const cols = Math.floor(c.width / 16) + 5;
    drops = Array(cols).fill(0).map(() => Math.floor(Math.random() * (c.height / 16)));
    const b = document.getElementById('gBox').getBoundingClientRect();
    mc.width = b.width; mc.height = b.height;
    const mCols = Math.floor(mc.width / 14) + 5;
    mDrops = Array(mCols).fill(0).map(() => Math.floor(Math.random() * (mc.height / 14)));
    setInterval(drawGlobalMatrix, 33);
    setInterval(drawMenuMatrix, 40);
}

function drawGlobalMatrix() {
    x.fillStyle = 'rgba(5,0,0,0.05)'; x.fillRect(0, 0, c.width, c.height);
    x.fillStyle = '#ff1a1a'; x.font = '16px monospace';
    drops.forEach((d, i) => {
        const txt = mch[Math.floor(Math.random() * mch.length)];
        x.fillText(txt, i * 16, d * 16);
        if (d * 16 > c.height && Math.random() > 0.975) drops[i] = 0;
        drops[i]++;
    });
}

function drawMenuMatrix() {
    if (!mc.width) return;
    mx.fillStyle = 'rgba(10,18,10,0.08)'; mx.fillRect(0, 0, mc.width, mc.height);
    mx.fillStyle = '#2ecc71'; mx.font = '14px monospace';
    mDrops.forEach((d, i) => {
        const txt = mch[Math.floor(Math.random() * mch.length)];
        mx.fillText(txt, i * 14, d * 14);
        if (d * 14 > mc.height && Math.random() > 0.95) mDrops[i] = 0;
        mDrops[i]++;
    });
}

window.addEventListener('resize', () => {
    if(c && mc) {
        c.width = window.innerWidth; c.height = window.innerHeight;
        const b = document.getElementById('gBox').getBoundingClientRect();
        mc.width = b.width; mc.height = b.height;
    }
});

function speakImmediate(text, locale) {
    if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        setTimeout(() => {
            const u = new SpeechSynthesisUtterance();
            u.text = text; u.lang = locale; u.rate = 0.9; u.pitch = 0.85;
            const voices = window.speechSynthesis.getVoices();
            let targetVoice = voices.find(v => v.lang.includes(locale) || v.lang.replace('_', '-').includes(locale));
            if (!targetVoice && (locale.startsWith('be') || locale.startsWith('uk'))) {
                targetVoice = voices.find(v => v.lang.startsWith('ru')); u.lang = 'ru-RU';
                if (locale.startsWith('be')) u.text = text.replace(/і/g, 'и').replace(/ў/g, 'в').replace(/э/g, 'э').replace(/я/g, 'я');
                if (locale.startsWith('uk')) u.text = text.replace(/і/g, 'и').replace(/ї/g, 'йи').replace(/є/g, 'е').replace(/и/g, 'ы');
            }
            if (targetVoice) u.voice = targetVoice;
            window.speechSynthesis.speak(u);
        }, 50);
    }
}

let userHasInteracted = false;
window.addEventListener('click', () => {
    if (!userHasInteracted) {
        userHasInteracted = true;
        snd(523.25, 0.15);
        startChineseBGM();
